name: Package macOS tray

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tray/**"
      - ".github/workflows/package-tray-macos.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile and package app image
        run: bash tray/package-macos.sh

      - name: Verify launcher and bundled runtime
        run: |
          test -x "tray/build/package/Dev Critter.app/Contents/MacOS/Dev Critter"
          test -d "tray/build/package/Dev Critter.app/Contents/runtime"
